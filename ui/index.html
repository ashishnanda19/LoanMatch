<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loan Eligibility Engine · Upload users</title>
  <style>
    :root { --fg:#1a1a1a; --muted:#666; --line:#d9d9d9; --accent:#1f6feb; --ok:#1a7f37; --err:#cf222e; }
    body { font:16px/1.5 system-ui,sans-serif; color:var(--fg); max-width:560px; margin:48px auto; padding:0 16px; }
    h1 { font-size:1.4rem; margin-bottom:4px; }
    p.sub { color:var(--muted); margin-top:0; }
    .card { border:1px solid var(--line); border-radius:8px; padding:20px; }
    input[type=file] { width:100%; margin:8px 0 16px; }
    button { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:10px 18px; font-size:1rem; cursor:pointer; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    progress { width:100%; height:14px; margin-top:16px; display:none; }
    #status { margin-top:14px; min-height:1.5em; }
    .ok { color:var(--ok); } .err { color:var(--err); }
    code { background:#f4f4f4; padding:1px 5px; border-radius:4px; }
    details { margin-top:18px; color:var(--muted); font-size:.9rem; }
    details input { width:100%; }
  </style>
</head>
<body>
  <h1>Upload user CSV</h1>
  <p class="sub">Columns: <code>user_id, name, email, monthly_income, credit_score, employment_status, age</code></p>

  <div class="card">
    <label for="file">CSV file</label>
    <input id="file" type="file" accept=".csv,text/csv">
    <button id="upload" disabled>Upload</button>
    <progress id="bar" max="100" value="0"></progress>
    <div id="status" role="status" aria-live="polite"></div>
  </div>

  <details>
    <summary>API settings</summary>
    <label for="api">API base URL</label>
    <input id="api" type="url" placeholder="https://xxxx.execute-api.ap-south-1.amazonaws.com">
  </details>

  <script src="config.js" onerror="window.CONFIG = window.CONFIG || {}"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const fileInput = $("file"), btn = $("upload"), bar = $("bar"), status = $("status"), api = $("api");

    api.value = localStorage.getItem("apiUrl") || (window.CONFIG && window.CONFIG.API_URL) || "";
    api.addEventListener("change", () => localStorage.setItem("apiUrl", api.value.trim()));

    const setStatus = (msg, cls = "") => { status.textContent = msg; status.className = cls; };
    const refresh = () => { btn.disabled = !fileInput.files.length; };
    fileInput.addEventListener("change", refresh);

    btn.addEventListener("click", async () => {
      const file = fileInput.files[0];
      const base = api.value.trim().replace(/\/$/, "");
      if (!file) return;
      if (!base) { setStatus("Set the API base URL under “API settings”.", "err"); return; }

      btn.disabled = true; bar.style.display = "block"; bar.value = 0;
      try {
        // 1) ask our API for a presigned S3 POST (small JSON request)
        setStatus("Requesting upload URL…");
        const res = await fetch(base + "/upload-url", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ filename: file.name }),
        });
        const info = await res.json();
        if (!res.ok) throw new Error(info.error || ("HTTP " + res.status));
        if (file.size > info.max_bytes) throw new Error("File is larger than the " + (info.max_bytes / 1048576) + " MB limit.");

        // 2) upload straight to S3 (bypasses API Gateway). The file field must come last.
        const form = new FormData();
        Object.entries(info.fields).forEach(([k, v]) => form.append(k, v));
        form.append("file", file);

        await new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.open("POST", info.upload_url);
          xhr.upload.onprogress = (e) => {
            if (e.lengthComputable) {
              bar.value = (e.loaded / e.total) * 100;
              setStatus("Uploading… " + Math.round(bar.value) + "%");
            }
          };
          xhr.onload = () => (xhr.status >= 200 && xhr.status < 300) ? resolve() : reject(new Error("S3 rejected the upload (HTTP " + xhr.status + ")"));
          xhr.onerror = () => reject(new Error("Network error during upload"));
          xhr.send(form);
        });

        bar.value = 100;
        setStatus("Uploaded. Batch " + info.batch_id + " is now being processed — users are parsed into the database and matching starts automatically.", "ok");
      } catch (err) {
        setStatus("Upload failed: " + err.message, "err");
      } finally {
        refresh();
      }
    });
  </script>
</body>
</html>
